<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKAY Admin — Gestione Prenotazioni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">OKAY</div>
    <div class="login-sub">Admin Panel</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@okaybari.it" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">OKAY</div>
      <div class="topbar-title">Pannello Admin</div>
    </div>
    <div class="topbar-right">
      <div class="user-badge">Connesso come <span id="user-email-display">—</span></div>
      <button class="logout-btn" id="logout-btn">Esci</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="nav-section">Menu</div>
      <div class="nav-item active" data-page="reservations">📅 Prenotazioni</div>
      <div class="nav-item" data-page="summary">📊 Riepilogo Giorno</div>
      <div class="nav-section">Admin</div>
      <div class="nav-item" data-page="logs">📝 Log Attività</div>
      <div class="nav-item" data-page="users">👤 Utenti</div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="content">
      <!-- Contenuto dinamico -->
    </div>
  </div>
</div>

<!-- ==================== MODAL ==================== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Dettaglio</div>
      <button class="modal-close" data-modal-action="close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div id="toast-container"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
